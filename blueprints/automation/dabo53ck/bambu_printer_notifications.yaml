blueprint:
  name: Bambu Printer Notifications
  author: dabo53ck
  domain: automation
  source_url: https://github.com/dabo53ck/bambu-printer-notifications-blueprint/blob/main/blueprints/automation/dabo53ck/bambu_printer_notifications.yaml
  homeassistant:
    min_version: "2024.10.0"
  description: |-
    # Bambu Printer Notifications

    ![Version](https://img.shields.io/badge/version-0.0.1--beta-blue) &nbsp;&nbsp;&nbsp; [![GitHub](https://img.shields.io/badge/GitHub-Repository-black)](https://github.com/dabo53ck/bambu-printer-notifications-blueprint) &nbsp;&nbsp;&nbsp; [![Issues](https://img.shields.io/badge/Issues-red)](https://github.com/dabo53ck/bambu-printer-notifications-blueprint/issues)

    Sends a notification with a camera snapshot when a Bambu Lab printer finishes a print or faults.

    The snapshot is triggered by the printer **stage** leaving the printing phase, not by a progress percentage. On a P1S that is roughly 40 seconds before the progress and status sensors update, so the finished print is still on the plate in the photo.

    Built on the [Bambu Lab integration](https://github.com/greghesp/ha-bambulab). Based on the original blueprint by [HallyAus](https://github.com/HallyAus/homeassistant-bambu-blueprints) — thank you! Not affiliated with Bambu Lab.

    <details><summary>Key Features</summary>

    • **Snapshot at the earliest reliable end-of-print signal** — before the build plate lowers
    • **Optional snapshot light** — switched on for the photo, restored afterwards
    • **Two delivery paths** — a legacy `notify.<service>` (image, tag, critical alerts, action button) and/or notify entities via `notify.send_message` (title and message only)
    • **Critical alerts (iOS)** with a time window, configured separately for success and fault
    • **Time of day with seconds** in every message, 24h or 12h AM/PM
    • **Persistent notification** on faults
    • **Custom actions** on success and on fault
    • **Per-automation snapshot file** — several printers or automations never overwrite each other

    </details>

    Full documentation: [README](https://github.com/dabo53ck/bambu-printer-notifications-blueprint#readme)

  input:
    printer_sensors:
      name: Printer Sensors
      icon: mdi:printer-3d
      description: Entities of your Bambu printer.
      collapsed: false
      input:
        print_status_sensor:
          name: Print status sensor
          description: Sensor with the states `running`, `finish` and `failed`.
          selector:
            entity:
              domain: sensor
        print_error_binary:
          name: Print error binary sensor
          description: Binary sensor that turns on when the printer reports an error.
          selector:
            entity:
              domain: binary_sensor
        current_stage_sensor:
          name: Current stage sensor
          description: >-
            Stage sensor (`printing`, `idle`, ...). It drives the primary trigger,
            so it should be mapped.
          selector:
            entity:
              domain: sensor
        progress_sensor:
          name: Progress sensor
          description: Print progress in percent.
          selector:
            entity:
              domain: sensor
        printer_name_sensor:
          name: Printer name sensor
          description: Sensor with the printer name. Used in the notification title.
          selector:
            entity:
              domain: sensor
        task_name_sensor:
          name: Task name sensor
          description: Sensor with the name of the current print job.
          selector:
            entity:
              domain: sensor
        print_weight_sensor:
          name: Print weight sensor
          description: Sensor with the print weight in grams.
          selector:
            entity:
              domain: sensor
        camera:
          name: Printer camera
          selector:
            entity:
              domain: camera

    snapshot_settings:
      name: Snapshot Settings
      icon: mdi:camera
      description: How the snapshot is captured.
      collapsed: true
      input:
        snapshot_light:
          name: Snapshot light (optional)
          description: >-
            Light that is switched on before the snapshot and restored to its
            previous state afterwards. Leave empty to skip.
          default: ""
          selector:
            entity:
              domain: light
        snapshot_light_brightness:
          name: Snapshot light brightness (%)
          description: Brightness of the snapshot light while the photo is taken.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
        snapshot_delay_seconds:
          name: Snapshot delay (seconds)
          description: >-
            Wait before the snapshot, for light warm-up or camera exposure. Every
            second counts: the build plate starts lowering shortly after the print
            ends, so keep this at 0-1 s.
          default: 1
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: seconds
              mode: slider

    notification_settings:
      name: Notification Settings
      icon: mdi:bell
      description: Where and how notifications are delivered.
      collapsed: false
      input:
        notifications_enabled_boolean:
          name: Notifications enabled
          description: Notifications are only sent while this input_boolean is on.
          selector:
            entity:
              domain: input_boolean
        notify_device:
          name: Notify service (legacy)
          description: >-
            Name of a notify service, for example `mobile_app_your_phone`, with or
            without the `notify.` prefix. Supports the snapshot image, critical
            alerts and the action button. Leave empty to skip.
          default: ""
          selector:
            text:
        notify_entities:
          name: Notify entities
          description: >-
            Notify entities that receive the title and message through
            `notify.send_message`. This path cannot carry the snapshot image or
            critical alerts. Leave empty to skip.
          default: []
          selector:
            entity:
              domain: notify
              multiple: true
        time_format:
          name: Time format
          description: >-
            Clock format of the time shown in the message. Seconds are always
            included.
          default: "24h"
          selector:
            select:
              options:
                - label: "24h (14:05:09)"
                  value: "24h"
                - label: "12h AM/PM (02:05:09 PM)"
                  value: "12h"

    success_notification_settings:
      name: Success Notification Settings
      icon: mdi:check-circle
      description: Notifications for finished prints.
      collapsed: true
      input:
        success_notification_type:
          name: Success notification type
          description: >-
            **Normal** and **Never critical** send a standard notification.
            **Critical** sends a critical alert inside the time window below.
          default: normal
          selector:
            select:
              options:
                - label: "Normal"
                  value: "normal"
                - label: "Critical (during time window)"
                  value: "critical"
                - label: "Never critical"
                  value: "never_critical"
        success_critical_start:
          name: Success critical window start
          description: Only applies when the type is Critical.
          default: "07:00:00"
          selector:
            time: {}
        success_critical_end:
          name: Success critical window end
          description: >-
            Only applies when the type is Critical. Identical start and end means
            never critical. For around the clock use 00:00:00 to 23:59:59.
          default: "21:00:00"
          selector:
            time: {}

    fault_notification_settings:
      name: Fault Notification Settings
      icon: mdi:alert-circle
      description: Notifications for failed prints.
      collapsed: true
      input:
        fault_notification_type:
          name: Fault notification type
          description: >-
            **Normal** and **Never critical** send a standard notification.
            **Critical** sends a critical alert inside the time window below.
          default: critical
          selector:
            select:
              options:
                - label: "Normal"
                  value: "normal"
                - label: "Critical (during time window)"
                  value: "critical"
                - label: "Never critical"
                  value: "never_critical"
        fault_critical_start:
          name: Fault critical window start
          description: Only applies when the type is Critical.
          default: "07:00:00"
          selector:
            time: {}
        fault_critical_end:
          name: Fault critical window end
          description: >-
            Only applies when the type is Critical. Identical start and end means
            never critical. For around the clock use 00:00:00 to 23:59:59.
          default: "21:00:00"
          selector:
            time: {}

    critical_alert_settings:
      name: Critical Alert Settings
      icon: mdi:volume-high
      description: Sound and volume of critical alerts (iOS).
      collapsed: true
      input:
        critical_sound:
          name: Critical alert sound
          description: iOS sound name, for example `default`, `alert`, `bell` or `chime`.
          default: "default"
          selector:
            text: {}
        critical_volume:
          name: Critical alert volume
          description: Volume from 0.0 to 1.0.
          default: 1.0
          selector:
            number:
              min: 0.0
              max: 1.0
              step: 0.1
              mode: slider

    custom_actions:
      name: Custom Actions
      icon: mdi:cog-play
      description: >-
        Your own actions when a print finishes or fails, for example an indicator
        light, a smart plug, a script or another notification service.
      collapsed: true
      input:
        success_actions:
          name: Actions on successful print (optional)
          default: []
          selector:
            action: {}
        fault_actions:
          name: Actions on print fault (optional)
          default: []
          selector:
            action: {}

    optional_features:
      name: Optional Features
      icon: mdi:puzzle
      description: Additional settings.
      collapsed: true
      input:
        printers_view_uri:
          name: Printers view path (optional)
          description: >-
            Dashboard path such as `/lovelace/3d_printers`. Adds an "Open Printers"
            button to the notification (legacy notify service only). Leave empty to
            disable.
          default: ""
          selector:
            text: {}

# Later triggers of the same print (progress, status) would overwrite the
# already correct snapshot and replace the notification, so they are dropped
# while a run is in flight.
mode: single
max_exceeded: silent

trace:
  stored_traces: 20

variables:
  print_status_sensor: !input print_status_sensor
  print_error_binary: !input print_error_binary
  progress_sensor: !input progress_sensor
  printer_name_sensor: !input printer_name_sensor
  task_name_sensor: !input task_name_sensor
  print_weight_sensor: !input print_weight_sensor
  camera_entity: !input camera
  snapshot_light: !input snapshot_light
  snapshot_light_brightness: !input snapshot_light_brightness
  snapshot_delay_seconds: !input snapshot_delay_seconds
  notify_device: !input notify_device
  notify_entities: !input notify_entities
  time_format: !input time_format
  success_notification_type: !input success_notification_type
  success_critical_start: !input success_critical_start
  success_critical_end: !input success_critical_end
  fault_notification_type: !input fault_notification_type
  fault_critical_start: !input fault_critical_start
  fault_critical_end: !input fault_critical_end
  critical_sound: !input critical_sound
  critical_volume: !input critical_volume
  printers_view_uri: !input printers_view_uri
  success_actions: !input success_actions
  fault_actions: !input fault_actions

  printer_name: "{{ states(printer_name_sensor) }}"
  task_name: "{{ states(task_name_sensor) }}"

  has_snapshot_light: "{{ snapshot_light not in ['', none, []] }}"
  has_success_actions: "{{ success_actions not in [none, ''] and success_actions | length > 0 }}"
  has_fault_actions: "{{ fault_actions not in [none, ''] and fault_actions | length > 0 }}"

  notify_service: "{{ notify_device | trim | regex_replace('^notify\\.', '') }}"
  has_notify_service: "{{ notify_service | length > 0 }}"
  has_notify_entities: "{{ notify_entities | length > 0 }}"

  # One file and one notification tag per automation, so two automations for
  # the same printer (or two printers) never overwrite each other. The query
  # string defeats image caching in the companion app.
  automation_key: "{{ this.entity_id.split('.')[1] }}"
  snapshot_file: "/config/www/snapshots/bambu_{{ automation_key }}.jpg"
  snapshot_url: "/local/snapshots/bambu_{{ automation_key }}.jpg?v={{ as_timestamp(now()) | int }}"
  notification_tag: "bambu_print_{{ automation_key }}"

triggers:
  # Primary: the stage returns to idle. Only this transition is used, not
  # every change away from an active stage - printing -> inspecting_first_layer
  # happens mid-print. On a P1S it comes about 40 s before progress and status
  # update, which is when the build plate starts to lower.
  - trigger: state
    id: stage_ended
    entity_id: !input current_stage_sensor
    from:
      - printing
      - inspecting_first_layer
      - auto_bed_leveling
    to: idle

  # Fallback for a missing stage sensor or other printer models. Progress can
  # skip values (97 -> 100), so "above: 99" is the only threshold that is
  # always crossed.
  - trigger: numeric_state
    id: progress_threshold
    entity_id: !input progress_sensor
    above: 99

  - trigger: state
    id: status_finish
    entity_id: !input print_status_sensor
    from: running
    to: finish

  - trigger: state
    id: status_failed
    entity_id: !input print_status_sensor
    from:
      - running
      - prepare
      - pause
    to: failed

  - trigger: state
    id: error_detected
    entity_id: !input print_error_binary
    from: "off"
    to: "on"

conditions:
  - alias: Notifications are enabled
    condition: state
    entity_id: !input notifications_enabled_boolean
    state: "on"

  - alias: Required sensors are available
    condition: not
    conditions:
      - condition: state
        entity_id: !input printer_name_sensor
        state:
          - unavailable
          - unknown
      - condition: state
        entity_id: !input print_status_sensor
        state:
          - unavailable
          - unknown

  # A sensor coming back online (unavailable -> 100 %) is not a finished print.
  - alias: Trigger did not come from an offline state
    condition: template
    value_template: >-
      {{ (trigger.from_state.state | default('', true))
         not in ['offline', 'unavailable', 'unknown'] }}

actions:
  - alias: Capture snapshot
    if:
      - condition: template
        value_template: "{{ has_snapshot_light }}"
    then:
      - variables:
          light_was_on: "{{ is_state(snapshot_light, 'on') }}"
          light_previous_brightness: >-
            {{ state_attr(snapshot_light, 'brightness') | int(255) }}
      - action: light.turn_on
        target:
          entity_id: "{{ snapshot_light }}"
        data:
          brightness_pct: "{{ snapshot_light_brightness | int }}"
      - delay:
          seconds: "{{ [snapshot_delay_seconds | int(0), 0] | max }}"
      - action: camera.snapshot
        target:
          entity_id: "{{ camera_entity }}"
        data:
          filename: "{{ snapshot_file }}"
        continue_on_error: true
      - if:
          - condition: template
            value_template: "{{ light_was_on }}"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ snapshot_light }}"
            data:
              brightness: "{{ light_previous_brightness }}"
        else:
          - action: light.turn_off
            target:
              entity_id: "{{ snapshot_light }}"
    else:
      - delay:
          seconds: "{{ [snapshot_delay_seconds | int(0), 0] | max }}"
      - action: camera.snapshot
        target:
          entity_id: "{{ camera_entity }}"
        data:
          filename: "{{ snapshot_file }}"
        continue_on_error: true

  # wait_template checks the current state first, so a print that already
  # moved on to finish or idle while the snapshot was taken does not wait
  # for a state change that has already happened. "idle" is included because
  # "finish" is short-lived and usually gone by the time this step runs.
  - alias: Wait until the print has ended
    wait_template: >-
      {{ is_state(print_status_sensor, ['finish', 'failed', 'idle'])
         or is_state(print_error_binary, 'on') }}
    timeout: "00:10:00"
    continue_on_timeout: false

  - alias: Let the remaining sensors settle
    delay: "00:00:02"

  # The stage trigger fires before progress and status reach their final
  # values, so they are read again here.
  - variables:
      progress: "{{ states(progress_sensor) | int(0) }}"
      status: "{{ states(print_status_sensor) }}"
      print_weight: "{{ states(print_weight_sensor) }}"
      is_fault: >-
        {{ trigger.id in ['status_failed', 'error_detected']
           or is_state(print_status_sensor, 'failed')
           or is_state(print_error_binary, 'on') }}
      use_critical_alert: >-
        {% set kind = fault_notification_type if is_fault else success_notification_type %}
        {% set start = today_at(fault_critical_start if is_fault else success_critical_start).time() %}
        {% set end = today_at(fault_critical_end if is_fault else success_critical_end).time() %}
        {% set current = now().time() %}
        {{ kind == 'critical' and start != end
           and ((start <= current <= end) if start < end
                else (current >= start or current <= end)) }}
      notification_time: >-
        {{ now().strftime('%I:%M:%S %p') if time_format == '12h'
           else now().strftime('%H:%M:%S') }}
      notification_title: >-
        {{ printer_name }} {{ 'FAULT' if is_fault else 'Print Complete' }}
      # Explicit \n: indented Jinja lines would carry their YAML indentation
      # into the message.
      notification_message: >-
        {% if is_fault -%}
        ❌ Print Failed{{ "\n" }}File: {{ task_name or 'Unknown' }}{{ "\n" }}Progress: {{ progress }}%{{ "\n" }}Status: {{ status }}{{ "\n" }}Time: {{ notification_time }}
        {%- else -%}
        ✅ Print Successful{{ "\n" }}File: {{ task_name or 'Unknown' }}{{ "\n" }}Weight: {{ print_weight }}g{{ "\n" }}Progress: {{ progress }}%{{ "\n" }}Time: {{ notification_time }}
        {%- endif %}

  # Each output runs in its own branch: a notify service that does not exist
  # raises ServiceNotFound, which continue_on_error does not cover, and it
  # must not stop the other outputs or the custom actions.
  - alias: Deliver notifications and run custom actions
    parallel:
      - alias: Notify via legacy notify service
        if:
          - condition: template
            value_template: "{{ has_notify_service }}"
        then:
          - action: "notify.{{ notify_service }}"
            continue_on_error: true
            data:
              title: "{{ notification_title }}"
              message: "{{ notification_message }}"
              data:
                image: "{{ snapshot_url }}"
                tag: "{{ notification_tag }}"
                sticky: "{{ is_fault }}"
                persistent: "{{ is_fault }}"
                push: >-
                  {{ {'sound': {'name': critical_sound, 'critical': 1, 'volume': critical_volume}}
                     if use_critical_alert else {} }}
                actions: >-
                  {{ [{'action': 'URI', 'title': 'Open Printers', 'uri': printers_view_uri}]
                     if printers_view_uri | length > 0 else [] }}

      - alias: Notify via notify entities
        if:
          - condition: template
            value_template: "{{ has_notify_entities }}"
        then:
          - action: notify.send_message
            continue_on_error: true
            target:
              entity_id: "{{ notify_entities }}"
            data:
              title: "{{ notification_title }}"
              message: "{{ notification_message }}"

      - alias: Persistent notification on fault
        if:
          - condition: template
            value_template: "{{ is_fault }}"
        then:
          - action: persistent_notification.create
            data:
              title: "{{ printer_name }} Fault"
              message: >-
                {{ task_name or 'Print job' }} on {{ printer_name }} has a fault.
                Status: {{ status }}, progress {{ progress }}%.
              notification_id: "bambu_fault_{{ automation_key }}"

      - alias: Run custom actions
        choose:
          - conditions:
              - condition: template
                value_template: "{{ not is_fault and has_success_actions }}"
            sequence: !input success_actions
          - conditions:
              - condition: template
                value_template: "{{ is_fault and has_fault_actions }}"
            sequence: !input fault_actions
