name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or frustration behind the request, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The behaviour or input you have in mind.
    validations:
      required: true
  - type: dropdown
    id: printer
    attributes:
      label: Printer model
      description: Some behaviour depends on the model.
      options:
        - P1S
        - P1P
        - X1 / X1C / X1E
        - A1
        - A1 mini
        - H2D
        - Other / all
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Custom actions, other blueprints or workarounds.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
